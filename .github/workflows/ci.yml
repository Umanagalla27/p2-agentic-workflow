name: P2 Multi-Agent CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit & Security Tests
        run: |
          pytest tests/test_graph.py tests/test_tools.py tests/test_security.py -v

      - name: Run Multi-Agent Benchmark CI Gate
        run: |
          python eval/generate_scenarios.py
          pytest tests/test_agent_ci_gate.py -v
